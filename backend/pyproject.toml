[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "chromadb>=1.5.9",
    "docx2txt>=0.9",
    "fastapi>=0.162.0",
    "jinja2>=3.1.6",
    "langchain>=1.4.7",
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.7.3",
    "langchain-google-genai>=4.4.2",
    "langchain-tavily>=0.2.18",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.18",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "pypdf>=6.21.4",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.6",
    "tavily-python>=0.8.5",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "locust>=2.47.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
